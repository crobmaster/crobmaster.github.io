---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    {{ page.date | date: "%B %-d, %Y" }}
    {% if page.tags.size > 0 %}
      · {{ page.tags | join: ", " }}
    {% endif %}
  </p>
  <div class="post-content">
    {{ content }}
  </div>
  <a class="post-nav-back" href="/blog/">&larr; Back to all posts</a>
</article>
