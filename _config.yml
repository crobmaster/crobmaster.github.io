title: Crob Apps Dev Blog
description: >-
  Development notes from Crob Apps — Godot, mobile game dev, and the
  occasional detour, written up as they happen.
url: "https://crobmaster.github.io"
baseurl: ""
lang: en

author:
  name: Crobmaster
  email: crobmaster@gmail.com

permalink: /blog/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
